<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CIRCUIT BREAK — neon arena survival</title>
<style>
  :root { --ink: #05060a; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    overscroll-behavior: none;
  }
  body { cursor: crosshair; }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    background: var(--ink);
    outline: none;
  }
  /* Read aloud by screen readers, never shown: the status line the game announces. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  /* A visible focus ring only for keyboard users, so tabbing in is never a mystery. */
  #game:focus-visible { outline: 2px solid #22e6ff; outline-offset: -2px; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Circuit Break: a neon arena survival game. Move with WASD or the arrow keys, aim with the mouse, fire with click or space, pause with P or Escape, restart with R."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>
  <p style="color:#22e6ff;font:16px monospace;padding:32px">
    CIRCUIT BREAK needs JavaScript enabled: the whole game is drawn procedurally on a canvas.
  </p>
</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
